<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Titan Fit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="topo">

        <a href="index.html">
            <img src="fotos/logo_txt.png" alt="Titan Fit">
        </a>

        <div class="menu-toggle" onclick="toggleMenu()">
            ☰
        </div>

        <nav id="menu">

            <div class="close-menu" onclick="toggleMenu()">
                ✖
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="servico.html">
                        Serviços
                    </a>
                </li>

                <li>
                    <a href="sobre-nos.html">
                        Sobre Nós
                    </a>
                </li>

                <li>
                    <a href="planos.html">
                        Plano Premium
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =====================================================
         CADASTRO
    ====================================================== -->

    <main>

        <section class="conteudo-cadastro">

            <div class="cadastro-box">

                <h2 class="titulo-cadastro">
                    Cadastro
                </h2>

                <p>
                    Crie sua conta
                </p>


                <!-- =================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCadastro" autocomplete="on">

                    <!-- =================================================
                         ESCOLHA DO TIPO
                    ================================================== -->

                    <div class="escolha-professor-aluno">

                        <button type="button" class="botao-escolha ativo" data-tipo="aluno">
                            Aluno
                        </button>

                        <button type="button" class="botao-escolha" data-tipo="professor">
                            Professor
                        </button>

                    </div>


                    <!-- =================================================
                         TIPO
                    ================================================== -->

                    <input type="hidden" name="tipo" id="tipoInput" value="aluno">


                    <!-- =================================================
                         NOME
                    ================================================== -->

                    <div class="caixa-cadastro">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                    </div>


                    <!-- =================================================
                         E-MAIL
                    ================================================== -->

                    <div class="caixa-cadastro">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    </div>






                    <!-- =================================================
                         CPF
                    ================================================== -->

                    <div class="caixa-cadastro">

                        <label for="cpf">
                            CPF
                        </label>

                        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

                    </div>


                    <!-- =================================================
                         CAMPOS DO PROFESSOR
                    ================================================== -->

                    <div id="camposProfessor" style="display: none;">

                        <!-- CREF -->

                        <div class="caixa-cadastro">

                            <label for="cref">
                                CREF
                            </label>

                            <input type="text" id="cref" name="cref" placeholder="Digite seu CREF">

                        </div>


                        <!-- ESPECIALIDADE -->

                        <div class="caixa-cadastro">

                            <label for="especialidade">
                                Especialidade
                            </label>

                            <input type="text" id="especialidade" name="especialidade" placeholder="Ex: Musculação">

                        </div>


                        <!-- CURRÍCULO -->

                        <div class="caixa-cadastro">

                            <label for="curriculo">
                                Currículo
                            </label>

                            <textarea id="curriculo" name="curriculo" placeholder="Digite seu currículo"></textarea>

                        </div>


                        <!-- BACHARELADO -->

                        <div class="caixa-cadastro">

                            <label for="bacharelado">
                                Bacharelado
                            </label>

                            <input type="text" id="bacharelado" name="bacharelado"
                                placeholder="Ex: Bacharelado em Educação Física">

                        </div>


                        <!-- FORMAÇÃO ACADÊMICA -->

                        <div class="caixa-cadastro">

                            <label for="formacao_academica">
                                Formação acadêmica
                            </label>

                            <input type="text" id="formacao_academica" name="formacao_academica"
                                placeholder="Digite sua formação acadêmica">

                        </div>

                    </div>


                    <!-- =================================================
                         SENHA
                    ================================================== -->

                    <div class="caixa-cadastro">

                        <label for="senha-cadastro">
                            Senha
                        </label>

                        <input type="password" id="senha-cadastro" name="senha" placeholder="Digite sua senha" required>

                    </div>


                    <!-- =================================================
                         CONFIRMAR SENHA
                    ================================================== -->

                    <div class="caixa-cadastro">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <input type="password" id="confirmar-senha" name="confirmarSenha"
                            placeholder="Digite sua senha novamente" required>

                    </div>


                    <!-- =================================================
                         BOTÃO
                    ================================================== -->

                    <button type="submit" class="btn-cadastro">
                        Cadastrar
                    </button>


                    <!-- =================================================
                         LOGIN
                    ================================================== -->

                    <p class="ja-tem-conta">
                        Já tem conta?
                    </p>

                    <a href="login.html" class="link-login">
                        Entrar
                    </a>

                </form>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="interacao.js"></script>
    <script src="conexoes.js"></script>

</body>

</html>
